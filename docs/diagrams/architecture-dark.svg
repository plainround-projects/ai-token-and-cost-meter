<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
<title id="t">Architecture of ai-token-and-cost-meter: estimate, call, journal, compare</title>
<desc id="d">An operator runs make run, which calls the meter command in the Python package token_meter. The command starts RunMeter, which asks TokenEstimator for a cost estimate before any call, then sends one request per missing key through the ChatModel port. The adapters are Recorded, OpenAI-compatible and Claude: the recorded adapter replays 450 stored answers, the local one calls ollama with qwen2.5:0.5b, and the Claude adapter cannot take sampling settings. Each billed response is appended to the CSV journal at out/journal.csv with an fsync. The report reads the journal and compares it, with the prompts and dated prices in Inputs, in domain.analysis. In amber, the estimate runs low: chars divided by 4 alone is 37.5 percent low, with overhead 29 it is 20.8 percent low, and leave-one-out is 1.0 percent low.</desc>
<style>
