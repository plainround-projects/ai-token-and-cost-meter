<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="t d">
<title id="t">One run of ai-token-and-cost-meter in ten rows</title>
<desc id="d">Ten rows run top to bottom across five lanes: the meter CLI, Report, RunMeter, ChatModel and the CSV journal. The CLI reads settings, loads 50 prompts and the price file, and opens the journal. Step 5 estimates 450 calls before any call is made. In amber, step 5x: over budget, the run refuses to start with exit 3 and the model sees nothing. Otherwise RunMeter calls the model once per key, appends one row and fsyncs, and stops between calls on SIGTERM. The last step is the report, which ends with an estimated cost of 0.033820 dollars against a billed 0.033896. Steps 6a and 6b are two rows of one step.</desc>
<style>
:root{--paper:#0d1117;--ink:#f5f4f8;--mute:#9a96ab;--accent:#6ec8ff;--good:#7ce0a1;--warn:#ffd166}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="889" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="888" rx="16"/>
<text class="title" x="48" y="68">One run of the meter, step by step</text>
<text class="caption" x="48" y="100">Checks first, then one journaled call per key. The amber row refuses an over-budget run before any call.</text>

<rect class="svc" x="400" y="128" width="140" height="48" rx="10"/>
<text class="lane" x="470" y="158" text-anchor="middle">meter CLI</text>
<rect class="svc" x="560" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="620" y="158" text-anchor="middle">Report</text>
<rect class="svc" x="710" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="770" y="158" text-anchor="middle">RunMeter</text>
<rect class="svc" x="860" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="920" y="158" text-anchor="middle">ChatModel</text>
<rect class="svc" x="1005" y="128" width="140" height="48" rx="10"/>
<text class="lane" x="1075" y="158" text-anchor="middle">CSV journal</text>
<path class="hair" d="M470 176V818M620 176V818M770 176V752M920 176V624M1075 176V690"/>
<path class="hair" d="M66 216V792"/>

<circle class="dot" cx="66" cy="216" r="15"/><text class="num" x="66" y="221" text-anchor="middle">1</text>
<text class="label b t-ink" x="96" y="212">Read the settings</text>
<text class="sub" x="96" y="232">a bad value: exit 2, its name</text>
<rect class="slot" x="464" y="198" width="12" height="36" rx="4"/>
<text class="label t-accent" x="486" y="221">settings</text>

<circle class="dot" cx="66" cy="280" r="15"/><text class="num" x="66" y="285" text-anchor="middle">2</text>
<text class="label b t-ink" x="96" y="276">Load 50 prompts, check them</text>
<text class="sub" x="96" y="296">a bad line: reported by number</text>
<rect class="slot" x="464" y="262" width="12" height="36" rx="4"/>
<text class="label t-accent" x="486" y="285">prompts.jsonl</text>

<circle class="dot" cx="66" cy="344" r="15"/><text class="num" x="66" y="349" text-anchor="middle">3</text>
<text class="label b t-ink" x="96" y="340">Load the price file</text>
<text class="sub" x="96" y="360">older than the max age: exit 3</text>
<rect class="slot" x="464" y="326" width="12" height="36" rx="4"/>
<text class="label t-accent" x="486" y="349">prices.json</text>

<circle class="dot" cx="66" cy="408" r="15"/><text class="num" x="66" y="413" text-anchor="middle">4</text>
<text class="label b t-ink" x="96" y="404">Open the journal</text>
<text class="sub" x="96" y="424">header once, torn tail removed</text>
<path class="sync" d="M470 408H1075"/>
<text class="label t-accent" x="932" y="398">open, trim</text>

<circle class="dot" cx="66" cy="472" r="15"/><text class="num" x="66" y="477" text-anchor="middle">5</text>
<text class="label b t-ink" x="96" y="468">Estimate before any call</text>
<text class="sub" x="96" y="488">450 calls, budget checked</text>
<path class="sync" d="M470 472H770"/>
<text class="label t-accent" x="632" y="462">run(plan)</text>
<rect class="slot" x="764" y="454" width="12" height="36" rx="4"/>
<text class="label t-accent" x="786" y="477">estimate()</text>

<circle class="dot-w" cx="66" cy="536" r="15"/><text class="num" x="66" y="541" text-anchor="middle">5x</text>
<text class="label b t-warn" x="96" y="532">Over budget: refuse to start</text>
<text class="sub" x="96" y="552">exit 3, the model saw nothing</text>
<path class="fail" d="M770 536H470"/>
<text class="label t-warn" x="632" y="526">exit 3</text>

<circle class="dot" cx="66" cy="600" r="15"/><text class="num" x="66" y="605" text-anchor="middle">6a</text>
<text class="label b t-ink" x="96" y="596">Call the model, once per key</text>
<text class="sub" x="96" y="616">prompt/setting/repeat tag</text>
<path class="sync" d="M770 600H920"/>
<text class="label t-accent" x="782" y="590">complete(tag)</text>

<circle class="dot" cx="66" cy="664" r="15"/><text class="num" x="66" y="669" text-anchor="middle">6b</text>
<text class="label b t-ink" x="96" y="660">Append one row, then fsync</text>
<text class="sub" x="96" y="680">billed tokens, stop reason</text>
<path class="sync" d="M770 664H1075"/>
<text class="label t-accent" x="932" y="654">append, fsync</text>

<circle class="dot" cx="66" cy="728" r="15"/><text class="num" x="66" y="733" text-anchor="middle">7</text>
<text class="label b t-ink" x="96" y="724">Stop between calls</text>
<text class="sub" x="96" y="744">SIGTERM: finish the call, exit 4</text>
<rect class="slot" x="764" y="710" width="12" height="36" rx="4"/>
<text class="label t-accent" x="786" y="733">finish, exit 4</text>

<circle class="dot-g" cx="66" cy="792" r="15"/><text class="num" x="66" y="797" text-anchor="middle">8</text>
<text class="label b t-ink" x="96" y="788">Report</text>
<text class="sub" x="96" y="808">estimate against the bill</text>
<path class="sync" d="M470 792H620"/>
<text class="label t-accent" x="482" y="782">meter report</text>
<rect class="win" x="650" y="772" width="366" height="40" rx="10"/>
<text class="label b t-good" x="666" y="797">estimated $0.033820, billed $0.033896</text>

<path class="sync" d="M48 846H112"/><text class="legend" x="124" y="851">sync call</text>
<path class="fail" d="M696 846H760"/><text class="legend" x="772" y="851">failure path</text>
</svg>
